name: Generate benchmark index

on:
  push:
    paths:
      - 'data/benchmarks/**'
      - 'scripts/generate-benchmark-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate index
        run: node scripts/generate-benchmark-index.mjs

      - name: Commit generated index
        run: |
          if git diff --quiet -- data/benchmarks.json; then
            echo "The benchmark index is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/benchmarks.json
          git commit -m "chore: update benchmark index"
          git push
