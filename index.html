<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#bc3005">
  <meta name="description" content="Browse PC game benchmark results from WeaBenchmark in a searchable, text-based archive.">
  <title>Wea's Benchmark Archive</title>
  <link rel="canonical" href="https://benchmark.wea017.net/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="Wea's Benchmark Archive">
  <meta property="og:title" content="Wea's Benchmark Archive">
  <meta property="og:description" content="Browse PC game benchmark results from WeaBenchmark in a searchable, text-based archive.">
  <meta property="og:url" content="https://benchmark.wea017.net/">
  <meta property="og:image" content="https://benchmark.wea017.net/assets/ogp/home.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Wea's Benchmark Archive data statistics">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Wea's Benchmark Archive">
  <meta name="twitter:description" content="Browse PC game benchmark results from WeaBenchmark in a searchable, text-based archive.">
  <meta name="twitter:image" content="https://benchmark.wea017.net/assets/ogp/home.png">
  <link rel="icon" type="image/webp" href="assets/WeaBenchmark_600px.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Dataset",
    "name": "Wea's Benchmark Archive",
    "description": "Machine-readable PC game benchmark measurements from the WeaBenchmark channel.",
    "creator": {
      "@type": "Organization",
      "name": "WeaBenchmark",
      "url": "https://www.youtube.com/@Wea_Benchmark"
    },
    "license": "https://creativecommons.org/publicdomain/zero/1.0/",
    "isAccessibleForFree": true
  }
  </script>
</head>
<body>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="index.html" data-i18n="siteBrand">うぇあのゲームベンチまとめ</a>
    <div class="header-actions"><label class="language-select"><span class="sr-only" data-i18n="language">言語</span><span class="material-symbols-outlined" aria-hidden="true">language</span><span class="language-current" aria-hidden="true">日本語</span><span class="material-symbols-outlined language-arrow" aria-hidden="true">keyboard_arrow_down</span><select id="language-switcher" aria-label="言語を選択"><option value="ja">日本語</option><option value="en">English</option></select></label><button class="theme-toggle" type="button" aria-label="ダークモードに切り替え"><span class="material-symbols-outlined" aria-hidden="true">dark_mode</span><span>ダーク</span></button></div>
  </div></header>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">WEA'S BENCHMARK ARCHIVE</p>
      <div class="hero-main">
        <div class="hero-copy">
          <h1 data-i18n="heroTitle">うぇあのゲームベンチまとめ</h1>
          <p class="hero-description" data-i18n="heroDescription">YouTubeチャンネル「WeaBenchmark」で検証した測定結果を<br>ゲーム・GPU・CPUから検索できます。</p>
        </div>
        <a class="youtube-channel-card" href="https://www.youtube.com/@Wea_Benchmark" target="_blank" rel="noopener" aria-label="WeaBenchmarkのYouTubeチャンネルを開く" data-i18n-aria-label="openYoutubeChannel">
          <img class="youtube-channel-avatar" src="assets/WeaBenchmark_600px.webp" alt="">
          <span class="youtube-channel-copy">
            <span class="youtube-channel-kicker" data-i18n="youtubeChannel">YouTubeチャンネル</span>
            <strong>WeaBenchmark</strong>
            <span class="youtube-channel-description" data-i18n="youtubeChannelDescription">動画で測定内容を見る</span>
          </span>
          <span class="material-symbols-outlined youtube-channel-arrow" aria-hidden="true">open_in_new</span>
        </a>
      </div>
      <dl class="hero-stats" aria-label="収録データ概要" data-i18n-aria-label="heroStats">
        <div class="hero-stat"><dt data-i18n="heroDataLabel">データ総数</dt><dd><span id="hero-stat-data">—</span><small data-i18n="heroDataUnit">件</small></dd></div>
        <div class="hero-stat"><dt data-i18n="heroGamesLabel">検証ゲーム</dt><dd><span id="hero-stat-games">—</span><small data-i18n="heroGamesUnit">タイトル</small></dd></div>
        <div class="hero-stat"><dt>GPU</dt><dd><span id="hero-stat-gpus">—</span><small data-i18n="heroComponentUnit">種類</small></dd></div>
        <div class="hero-stat"><dt>CPU</dt><dd><span id="hero-stat-cpus">—</span><small data-i18n="heroComponentUnit">種類</small></dd></div>
      </dl>
    </section>
    <section class="filters" aria-label="ベンチマークを検索" data-i18n-aria-label="searchLabel">
      <label><span data-i18n="game">ゲーム名</span><select id="game-filter"></select></label>
      <label><span data-i18n="gpu">GPU</span><select id="gpu-filter"></select></label>
      <label><span data-i18n="cpu">CPU</span><select id="cpu-filter"></select></label>
      <button id="clear-filters" type="button" data-i18n="clearFilters">条件をクリア</button>
    </section>
    <div class="results-heading">
      <div class="results-heading-title"><h2 data-i18n="latestBenchmarks">ベンチマーク一覧</h2><p id="result-count" aria-live="polite"></p></div>
      <div class="results-toolbar">
        <div class="view-toggle" role="group" aria-label="表示形式" data-i18n-aria-label="viewMode">
          <button class="view-toggle-button" type="button" data-view-mode="list" aria-label="リスト表示" data-i18n-aria-label="listView" aria-pressed="true"><span class="material-symbols-outlined" aria-hidden="true">view_list</span></button>
          <button class="view-toggle-button" type="button" data-view-mode="grid" aria-label="グリッド表示" data-i18n-aria-label="gridView" aria-pressed="false"><span class="material-symbols-outlined" aria-hidden="true">grid_view</span></button>
        </div>
        <nav id="pagination-top" class="pagination" aria-label="ページ切り替え" data-i18n-aria-label="pagination" hidden></nav>
      </div>
    </div>
    <div id="benchmark-list" class="benchmark-list" aria-live="polite"><p data-i18n="loading">データを読み込んでいます…</p></div>
    <nav id="pagination-bottom" class="pagination pagination-bottom" aria-label="ページ切り替え" data-i18n-aria-label="pagination" hidden></nav>
  </main>
  <footer><div class="container" data-i18n="footer">© Wea017net</div></footer>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
